    <script>
      // Theme before first paint: class + browser chrome, no flash.
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var forced = params.get('theme');
          var stored = null;
          try {
            stored = localStorage.getItem('yj-theme');
          } catch (e) {}
          var theme =
            forced === 'dark' || forced === 'light'
              ? forced
              : stored === 'dark' || stored === 'light'
                ? stored
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#111112' : '#fbfbf8');
        } catch (e) {}
      })();
    </script>

    <script>
      // Stamp the IST clock before first paint. The prerendered slot starts as
      // "--:--"; this replaces it with the real time, and Hero reads it back
      // during hydration so nothing shifts.
      (function () {
        try {
          var time = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Kolkata',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          }).format(new Date());
          var el = document.querySelector('[data-ist]');
          if (el) el.textContent = time + ' IST';
        } catch (e) {}
      })();
    </script>
