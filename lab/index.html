    <script type="application/ld+json">
      {

        }
      }

    <script>
      // Theme before first paint: class + browser chrome, no flash. This must
      // match index.html so moving between the portfolio and the Lab never
      // flips the theme.
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var forced = params.get('theme');
          var stored = null;
          try {
            stored = localStorage.getItem('yj-theme');
          } catch (e) {}
          var theme =
            forced === 'dark' || forced === 'light'
              ? forced
              : stored === 'dark' || stored === 'light'
                ? stored
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#111112' : '#fbfbf8');
        } catch (e) {}
      })();
    </script>
